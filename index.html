<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>HBC 일봉 차트 (LBank HB/USDT)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #05070b;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
    #error {
      color: #ff6b6b;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

<div id="chart"></div>
<div id="error"></div>

<script>

const container = document.getElementById("chart");
const chart = LightweightCharts.createChart(container, {
  width: container.clientWidth,
  height: container.clientHeight,
  layout: { background: { color: "#05070b" }, textColor: "#dcdff5" },
  grid: {
    vertLines: { color: "#151827" },
    horzLines: { color: "#151827" },
  },
  timeScale: { borderColor: "#22263a" },
  rightPriceScale: { borderColor: "#22263a" },
});

const candleSeries = chart.addCandlestickSeries({
  upColor: "#26a69a",
  downColor: "#ef5350",
  wickUpColor: "#26a69a",
  wickDownColor: "#ef5350",
  borderVisible: false,
});

async function loadData() {
  const errorBox = document.getElementById("error");
  try {
    const res = await fetch("/.netlify/functions/hbc");
    const real = await res.json();

    if (!real.data || !Array.isArray(real.data) || real.data.length === 0) {
      throw new Error("NO DATA FROM EXCHANGE");
    }

    const candles = real.data.map(c => ({
      time: c[0] / 1000,
      open: parseFloat(c[1]),
      high: parseFloat(c[3]),
      low: parseFloat(c[4]),
      close: parseFloat(c[2])
    }));

    candleSeries.setData(candles);
    chart.timeScale().fitContent();
  } catch (err) {
    console.error(err);
    errorBox.style.display = "block";
    errorBox.innerHTML = "⚠ 차트 데이터를 불러올 수 없습니다.";
  }
}

loadData();

window.addEventListener("resize", () => {
  chart.applyOptions({
    width: container.clientWidth,
    height: container.clientHeight,
  });
});

</script>

</body>
</html>
